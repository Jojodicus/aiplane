[package]
name = "aiplane-agents"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The agent builder's persistence: agents and their versions, system
# principals, the agent audit trail, embed keys, visitor sessions, A2A
# contexts, verifiers, tests, analytics, the inbox's notify
# channels, the principal-owned conversations, and the visitor rate gate.
# Stands on `aiplane-core` beside `aiplane-features` (neither depends on the
# other), so an agent DB edit rebuilds only this crate and what sits above
# it, and a runtime edit never recompiles it. See docs/architecture.md.

[dependencies]
aiplane-core = { path = "../aiplane-core" }
session-core = { path = "../session-core" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
